version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: webhook-sink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  webhook-sink:
    build: .
    container_name: webhook-sink-app
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
